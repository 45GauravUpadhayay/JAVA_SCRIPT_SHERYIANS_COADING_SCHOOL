<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Expense Tracker</h1>
      <p>Manage your daily expenses</p>
    </div>

    <div class="form">
      <input
        type="text"
        id="title"
        placeholder="Expense Name"
      >

      <input
        type="number"
        id="amount"
        placeholder="Amount"
      >

      <select id="category">
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
      </select>

      <button id="addBtn">Add Expense</button>
    </div>

    <div class="summary">
      <div class="card">
        <h3>Total Expense</h3>
        <span id="totalExpense">₹0</span>
      </div>

      <div class="card">
        <h3>This Month</h3>
        <span id="monthExpense">₹0</span>
      </div>
    </div>

    <!-- Yahin dynamic expenses add honge -->
    <div class="expenses" id="expensesContainer">

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
