<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        html,body{
            width: 100%;
            height: 100%;
        }

        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }

       input{
        display: none;
       }

       #btn{
        padding: 12px 22px;
        background-color: rgb(41,143,114);
        color: white;
        border-radius: 8px;
        font-weight: 900;
       }

       #btn:hover{
        background-color: rgb(2, 45, 33);
        border: 2px solid rgb(53, 240, 153);
        padding: 15px 25px;
        border-radius: 15px;
        box-shadow: -10px 10px 80px rgb(5, 243, 140);
       }

    </style>
</head>
<body>

    <div id="main">
        <input id="file" type="file">
        <div id="btn">
            Upload File
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
